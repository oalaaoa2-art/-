<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фрактальное дерево 🌲</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        input[type="range"] {
            width: 120px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <div class="slider-group">
            <label>🌿 Угол: <span id="angleValue">25</span>°</label>
            <input type="range" id="angleSlider" min="5" max="90" value="25" step="1">
        </div>
        <div class="slider-group">
            <label>📏 Длина: <span id="lengthValue">10</span></label>
            <input type="range" id="lengthSlider" min="5" max="20" value="10" step="1">
        </div>
        <div class="slider-group">
            <label>🌀 Глубина: <span id="depthValue">8</span></label>
            <input type="range" id="depthSlider" min="2" max="14" value="8" step="1">
        </div>
        <button id="regrowBtn">Вырастить заново 🌱</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Параметры дерева
        let angle = 25;
        let lengthMultiplier = 10; // масштабирует базовую длину
        let depth = 8;

        // Снежинки (массив частиц)
        const particles = [];
        const PARTICLE_COUNT = 100;

        // Обработчики ползунков
        const angleSlider = document.getElementById('angleSlider');
        const lengthSlider = document.getElementById('lengthSlider');
        const depthSlider = document.getElementById('depthSlider');
        const angleValue = document.getElementById('angleValue');
        const lengthValue = document.getElementById('lengthValue');
        const depthValue = document.getElementById('depthValue');

        angleSlider.addEventListener('input', (e) => {
            angle = parseInt(e.target.value);
            angleValue.textContent = angle;
            draw();
        });
        lengthSlider.addEventListener('input', (e) => {
            lengthMultiplier = parseInt(e.target.value);
            lengthValue.textContent = lengthMultiplier;
            draw();
        });
        depthSlider.addEventListener('input', (e) => {
            depth = parseInt(e.target.value);
            depthValue.textContent = depth;
            draw();
        });

        document.getElementById('regrowBtn').addEventListener('click', () => {
            growthProgress = 0; // сброс анимации роста
            draw();
            animateGrowth();
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
            draw();
        });

        // Инициализация снежинок
        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 3 + 1,
                    speed: Math.random() * 0.5 + 0.2,
                    wind: Math.random() * 0.4 - 0.2
                });
            }
        }
        initParticles();

        // Анимация роста дерева
        let growthProgress = 1; // 1 = полностью выросло
        function animateGrowth() {
            if (growthProgress < 1) {
                growthProgress += 0.02;
                if (growthProgress > 1) growthProgress = 1;
                draw();
                requestAnimationFrame(animateGrowth);
            }
        }

        // Основная функция рисования
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем снежинки
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Стартовая позиция дерева
            const startX = canvas.width / 2;
            const startY = canvas.height - 80;
            const baseLen = 20 * lengthMultiplier;

            // Рекурсивное рисование с учётом прогресса роста
            drawBranch(startX, startY, -90, baseLen, depth, growthProgress);
        }

        function drawBranch(x, y, angleDeg, length, depthRemaining, progress) {
            // Если ветка полностью скрыта прогрессом, не рисуем
            if (depthRemaining <= 0 || length <= 1) return;

            // Ограничиваем видимый рост: чем дальше от корня, тем позже появляется
            const maxAllowedDepth = Math.floor(progress * depth);
            if (depthRemaining > maxAllowedDepth + 1) return;

            // Частичная прозрачность для появляющихся веток
            let alpha = 1;
            if (depthRemaining === maxAllowedDepth + 1) {
                alpha = progress * depth - maxAllowedDepth; // плавное появление
            }
            alpha = Math.max(0, Math.min(1, alpha));

            const rad = angleDeg * Math.PI / 180;
            const newX = x + length * Math.cos(rad);
            const newY = y + length * Math.sin(rad);

            // Цвет ветки: коричневый для старых, зеленее для кончиков
            const r = 101 + (depthRemaining * 8);
            const g = 67 + (depthRemaining * 10);
            const b = 33;
            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
            ctx.lineWidth = depthRemaining * 0.8;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(newX, newY);
            ctx.stroke();

            // Рисуем листья, если это конечная ветка
            if (depthRemaining === 1 && alpha > 0.9) {
                ctx.fillStyle = `rgba(${34 + Math.random()*40}, ${139 + Math.random()*40}, 34, 0.9)`;
                ctx.beginPath();
                ctx.arc(newX, newY, 4 + Math.random()*4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Рекурсивно две дочерние ветви
            const shrink = 0.7 + (Math.random() * 0.05); // небольшой разброс
            const newAngleOffset = angle + (Math.random() * 2 - 1) * 3; // лёгкая асимметрия
            drawBranch(newX, newY, angleDeg - newAngleOffset, length * shrink, depthRemaining - 1, progress);
            drawBranch(newX, newY, angleDeg + newAngleOffset, length * shrink, depthRemaining - 1, progress);
        }

        // Цикл анимации снежинок
        function animateParticles() {
            for (let p of particles) {
                p.y += p.speed;
                p.x += p.wind;
                if (p.y > canvas.height + p.radius) {
                    p.y = -p.radius;
                    p.x = Math.random() * canvas.width;
                }
                if (p.x < -p.radius) p.x = canvas.width + p.radius;
                if (p.x > canvas.width + p.radius) p.x = -p.radius;
            }
            draw();
            requestAnimationFrame(animateParticles);
        }

        // Запуск
        draw();
        animateParticles();
        // Небольшая задержка, чтобы при первом открытии дерево плавно выросло
        growthProgress = 0;
        animateGrowth();
    </script>
</body>
</html>
